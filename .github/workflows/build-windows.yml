name: Build Windows app
on:
  push:
    branches: [release/jev-play-v2, release/windows-component-upgrade]
    paths: [desktop/release-request.json]
  workflow_dispatch:
    inputs:
      publish:
        description: Publish a new version after updating release version constants
        type: boolean
        default: false
permissions:
  contents: write
concurrency:
  group: windows-desktop-release
  cancel-in-progress: true
env:
  RELEASE_TAG: desktop-v0.4.1
  HF_HUB_DISABLE_XET: '1'
  HF_HUB_DISABLE_TELEMETRY: '1'
jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12.10'
      - name: Verify the requested Jev Play v2 release identity
        run: |
          python -c "import json; from pathlib import Path; r=json.loads(Path('desktop/release-request.json').read_text()); i=json.loads(Path('desktop/jev_sidecar/play_v2_identity.json').read_text()); m=json.loads(Path('weights/jev-play-v2/manifest.json').read_text()); assert r['version']=='0.4.1' and r['model_id']==i['model_id']==m['model_id']=='jev-play-v2'; assert r['identity_sha256']==i['identity_sha256']; assert r['archive_sha256']==m['archive_sha256']; assert i['source_step']==2088 and i['parameter_values_unchanged']"
      - name: Install frozen-app build dependencies
        run: |
          python -m unittest tests.desktop.test_archives
          python -m pip install --no-cache-dir -c desktop/constraints-runtime.txt -r desktop/requirements-ui.txt
          python -m pip install --no-cache-dir -c desktop/constraints-runtime.txt torch==2.11.0 --index-url https://download.pytorch.org/whl/cu128
          python -m pip install --no-cache-dir -c desktop/constraints-runtime.txt -r desktop/requirements-model.txt "pyinstaller==6.22.3"
          python -m unittest tests.desktop.test_call_policy
          python -m unittest tests.desktop.test_unified_policy tests.desktop.test_kans
      - name: Prepare verified model and local recognition assets
        run: |
          python tools/prepare_models.py --profile play-v2
          python desktop/fetch_assets.py
          python -c "import os; from pathlib import Path; from huggingface_hub import snapshot_download; snapshot_download('Qwen/Qwen3.5-0.8B', revision='2fc06364715b967f1860aea9cf38778875588b17', local_dir=Path(os.environ['LOCALAPPDATA'])/'JevMahjong-build-base', allow_patterns=['*.json','*.safetensors','*.jinja','*.model','LICENSE*'])"
      - name: Build Windows executable and bundled CUDA runtime
        run: ./desktop/windows/Build-Exe.ps1 -PythonPath (Get-Command python).Source
      - name: Verify the actual frozen executable including model inference
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $env:JEV_BASE_MODEL_DIR = Join-Path $env:LOCALAPPDATA 'JevMahjong-build-base'
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $p = Start-Process -FilePath './dist/JevMahjong/JevMahjong.exe' -ArgumentList '--self-test','--model-test','--report',"$pwd/frozen-selftest.json" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/JevMahjong/error.log" -ErrorAction SilentlyContinue; throw 'Frozen EXE failed' }
          $result = Get-Content frozen-selftest.json | ConvertFrom-Json
          if (!$result.model -or !$result.frozen_exe -or !$result.counters) { throw 'Actual model test did not run' }
          if ($result.model_id -ne 'jev-play-v2' -or $result.source_step -ne 2088) { throw 'Frozen EXE loaded the wrong model' }
          if (@($result.decisions.PSObject.Properties).Count -ne 7) { throw 'Incomplete action-path model checks' }
          Get-Content frozen-selftest.json
      - name: Build automatic runtime downloader installer
        run: |
          New-Item release -ItemType Directory -Force | Out-Null
          python tools/fetch_runtime_baseline.py
          if ($LASTEXITCODE -ne 0) { throw 'Baseline verification failed' }
          python tools/package_runtime_archives.py --baseline runs/runtime-baseline --version 0.4.1
          if ($LASTEXITCODE -ne 0) { throw 'Runtime archive build failed' }
          python -c "import json; from pathlib import Path; m=json.loads(Path('release/runtime-manifest.json').read_text()); print({k:v for k,v in m.items() if k not in ('required_runtime_files','application_files','model_files')}); assert m['application_download_bytes'] < 200000000, 'Unexpected full-runtime update'"
          $compiler = 'C:/Program Files (x86)/Inno Setup 6/ISCC.exe'
          if (!(Test-Path $compiler)) { choco install innosetup -y --no-progress }
          & $compiler desktop/windows/installer.iss
          if ($LASTEXITCODE -ne 0) { throw 'Installer build failed' }
          Remove-Item release/runtime-files.iss, release/reuse-constants.iss, release/reuse-runtime.sha256, release/reuse-app.sha256, release/reuse-model.sha256
          Get-ChildItem release | Format-Table Name,Length
          Get-ChildItem release | ForEach-Object { if ($_.Length -ge 2GB) { throw 'Release asset exceeds GitHub limit' } }
          Get-ChildItem release | Get-FileHash -Algorithm SHA256 | ForEach-Object { "$($_.Hash.ToLower())  $(Split-Path $_.Path -Leaf)" } | Set-Content release/SHA256SUMS.txt
      - name: Test actual 0.4.0 upgrade, fresh install, reinstall and repair
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Remove-Item dist/JevMahjong -Recurse -Force
          python tools/test_windows_upgrade.py --base-model "$env:LOCALAPPDATA/JevMahjong-build-base"
          if ($LASTEXITCODE -ne 0) { throw 'Actual installer upgrade tests failed' }
      - name: Test upgrade from the published 0.3.0 installation
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          Remove-Item runs/baseline-downloads -Recurse -Force
          python tools/fetch_runtime_baseline.py --legacy --cache runs/legacy-downloads --out runs/legacy-runtime
          if ($LASTEXITCODE -ne 0) { throw 'Legacy baseline verification failed' }
          python tools/test_windows_upgrade.py --baseline runs/legacy-runtime --cache runs/legacy-downloads --label 0.3.0 --upgrade-only --base-model "$env:LOCALAPPDATA/JevMahjong-build-base"
          if ($LASTEXITCODE -ne 0) { throw 'Actual 0.3.0 upgrade failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: windows-upgrade-checks
          path: windows-upgrade-results/
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: release/
          if-no-files-found: error
      - name: Publish tested Windows release
        if: ${{ inputs.publish || github.event_name == 'push' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = gh release view $env:RELEASE_TAG --json isDraft --jq '.isDraft' 2>$null
          if ($LASTEXITCODE -eq 0 -and $existing -ne 'true') { throw 'Never overwrite a published release' }
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:RELEASE_TAG --draft --target $env:GITHUB_SHA --title 'Jev Play v2 - Windows 0.4.1' --notes-file desktop/RELEASE_NOTES.md
          }
          $assets = (Get-ChildItem release -File).FullName
          gh release upload $env:RELEASE_TAG @assets --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Asset upload failed; release stays draft' }
          gh release edit $env:RELEASE_TAG --draft=false --prerelease=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
