name: Promote published release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing published release tag to mark as stable and Latest
        required: true
        default: desktop-v0.4.0
        type: string
  push:
    branches: [release/jev-play-v2-stable]
    paths: [.github/workflows/promote-release.yml]
permissions:
  contents: write
jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.tag || 'desktop-v0.4.0' }}
    steps:
      - name: Mark the existing installer release stable and Latest
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq 'if (.draft == false and any(.assets[]; (.state == "uploaded" and (.name | endswith(".exe"))))) then .tag_name else error("Expected a published installer release") end'
          gh release edit "$RELEASE_TAG" --prerelease=false --latest
          gh api "repos/$GH_REPO/releases/tags/$RELEASE_TAG" --jq 'if (.draft == false and .prerelease == false) then .tag_name else error("Release is not stable") end'
          actual_latest="$(gh api "repos/$GH_REPO/releases/latest" --jq '.tag_name')"
          test "$actual_latest" = "$RELEASE_TAG"
