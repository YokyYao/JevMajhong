name: Verify published Windows installer
on:
  workflow_run:
    workflows: ['Build Windows EXE release']
    types: [completed]
permissions:
  contents: read
jobs:
  public-download:
    if: github.event.workflow_run.conclusion == 'success'
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
      EXPECTED_SOURCE: ${{ github.event.workflow_run.head_sha }}
      QT_QPA_PLATFORM: offscreen
      HF_HUB_DISABLE_XET: '1'
      HF_HUB_DISABLE_TELEMETRY: '1'
    steps:
      - name: Download the published Setup EXE and verify its GitHub digest
        run: |
          $release = gh api repos/YokyYao/JevMajhong/releases/tags/desktop-v0.2.0 | ConvertFrom-Json
          if ($release.draft -or $release.target_commitish -ne $env:EXPECTED_SOURCE) { throw 'Release source mismatch' }
          $asset = $release.assets | Where-Object name -eq 'JevMahjong-Setup-0.2.0-win-x64.exe'
          if (!$asset) { throw 'Published installer missing' }
          $setup = Join-Path $env:RUNNER_TEMP 'JevMahjong-Setup.exe'
          Invoke-WebRequest $asset.browser_download_url -OutFile $setup
          $actual = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLower()
          if ($asset.digest -ne "sha256:$actual") { throw 'Downloaded installer digest mismatch' }
          Write-Output "Published installer SHA256: $actual"
      - name: Install through real public URLs then let the frozen EXE download its base model
        run: |
          $target = Join-Path $env:LOCALAPPDATA 'JevMahjong-public-download-test'
          $setup = Join-Path $env:RUNNER_TEMP 'JevMahjong-Setup.exe'
          $log = Join-Path $env:RUNNER_TEMP 'public-install.log'
          $p = Start-Process $setup -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART',"/DIR=$target","/LOG=$log" -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content $log -Tail 80; throw 'Public download installation failed' }
          $env:HF_HOME = Join-Path $env:LOCALAPPDATA 'JevMahjong-empty-hf-cache'
          Remove-Item Env:JEV_BASE_MODEL_DIR -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
          Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          $report = Join-Path $env:RUNNER_TEMP 'public-installed-selftest.json'
          $p = Start-Process "$target/JevMahjong.exe" -ArgumentList '--self-test','--model-test','--report',$report -Wait -PassThru
          if ($p.ExitCode -ne 0) { Get-Content "$env:LOCALAPPDATA/JevMahjong/error.log" -ErrorAction SilentlyContinue; throw 'Published app first model download or inference failed' }
          $result = Get-Content $report | ConvertFrom-Json
          if (!$result.model -or !$result.frozen_exe -or !$result.onnx -or !$result.gui) { throw 'Public application verification incomplete' }
          Get-Content $report
