name: Quick regression checks
on:
  push:
    paths: ['jevmahjong/**', 'desktop/**', 'tests/**', 'tools/**', 'pyproject.toml', '.github/workflows/ci.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  core:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install torch==2.11.0 --index-url https://download.pytorch.org/whl/cpu
      - run: python -m pip install -e '.[train]'
      - run: python -m unittest discover -s tests/core -v
  desktop:
    runs-on: windows-latest
    timeout-minutes: 15
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r desktop/requirements-ui.txt
      - run: python -m unittest discover -s tests/desktop -v
