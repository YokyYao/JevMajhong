[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "jevmahjong"
version = "0.3.0"
description = "Local Mahjong Soul adviser and native riichi training tools"
requires-python = ">=3.12"
dependencies = ["riichienv==0.4.11", "numpy", "huggingface-hub", "zstandard"]

[project.optional-dependencies]
train = ["torch>=2.11", "scipy", "mahjong==2.1.0", "safetensors"]

[project.scripts]
jevmahjong = "jevmahjong.__main__:main"

[tool.setuptools.packages.find]
include = ["jevmahjong*"]
